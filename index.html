<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tama-Dog-Chi — dog.nonarkara.org</title>
    <meta
      name="description"
      content="Tama-Dog-Chi: five illustrated dogs to care for, train and explore with. Kept on your own device."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbf9ed" />

    <!-- The fonts are served from this origin. A third-party stylesheet is a
         render-blocking request to somebody else's server, and this app
         stores a life on one device — it has no business phoning home to
         render a label. -->
    <link rel="preload" href="/fonts/non-architecture.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/dogs/oreo.webp" fetchpriority="high" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body class="bg-black text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
