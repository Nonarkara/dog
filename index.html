<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canine OS — dog.nonarkara.org</title>

      name="description"

    <!-- The fonts are served from this origin. A third-party stylesheet is a
         render-blocking request to somebody else's server, and this app
         stores a life on one device — it has no business phoning home to
         render a label. -->
    <link rel="preload" href="/fonts/josefin-sans-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-sans-3-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body class="bg-black text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
