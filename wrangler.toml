name = "dog"
account_id = "74ad6bf8dfaaccf82de6f0847f7d2d54"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

[[routes]]
pattern = "dog.nonarkara.org"
custom_domain = true

[observability]
enabled = true

# Live park rooms: one Durable Object per invite link (SQLite-backed, so it
# runs on the Workers Free plan). See design/live-sharing-plan.md.
[[durable_objects.bindings]]
name = "PARK_ROOM"
class_name = "ParkRoom"

[[migrations]]
tag = "v1-park-room"
new_sqlite_classes = ["ParkRoom"]
