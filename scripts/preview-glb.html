<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GLB preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0e; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const url = params.get('model') || '/expo/expo.glb';
const spin = params.get('spin') !== '0';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c0e);
scene.add(new THREE.AmbientLight(0xd8dbe4, 0.55));
const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
key.position.set(4, 6, 5); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb4d6, 1.3);
rim.position.set(-4, 3, -4); scene.add(rim);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
const pivot = new THREE.Group();
scene.add(pivot);

new GLTFLoader().load(url, (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => { if (o.isSkinnedMesh) o.frustumCulled = false; });

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  if (size.y > 0.0001) model.scale.setScalar(0.62 / size.y);
  const scaled = new THREE.Box3().setFromObject(model);
  model.position.y -= scaled.min.y;
  pivot.add(model);

  // FRAME FROM THE ACTUAL BOUNDS AND THE ACTUAL ASPECT.
  const b = new THREE.Box3().setFromObject(pivot);
  const s = b.getSize(new THREE.Vector3());
  const c = b.getCenter(new THREE.Vector3());
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * (innerWidth / innerHeight));
  const dist = Math.max(
    (Math.max(s.x, s.z) * 0.56) / Math.tan(hFov / 2),
    (s.y * 0.62) / Math.tan(vFov / 2)
  ) * 1.16;
  const target = new THREE.Vector3(c.x, c.y + s.y * 0.04, c.z);
  camera.position.set(target.x + dist * 0.34, target.y + s.y * 0.26, target.z + dist);
  camera.lookAt(target);

  document.title = `GLB preview — ${url} — bounds ${s.x.toFixed(2)}x${s.y.toFixed(2)}x${s.z.toFixed(2)}`;
  console.log('[preview] bounds', s.toArray().map((v) => +v.toFixed(3)));
  console.log('[preview] clips', (gltf.animations || []).map((a) => a.name));
  window.__ready = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  if (spin) pivot.rotation.y = clock.getElapsedTime() * 0.35;
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
